<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وليد | حساباتي</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
}

body {
  background: #111;
  color: white;
  overflow: hidden;
}

/* خلفية الفيديو */
.video-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* طبقة داكنة فوق الفيديو */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 1;
}

/* محتوى الصفحة */
.page {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.panel {
  width: min(420px, 100%);
  text-align: center;
  padding: 32px 22px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 28px;
  background: rgba(0,0,0,.35);
  backdrop-filter: blur(10px);
}

.avatar {
  width: 88px;
  height: 88px;
  margin: 0 auto 16px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: white;
  color: #111;
  font-size: 34px;
  font-weight: bold;
}

h1 {
  margin: 0 0 8px;
  font-size: 30px;
}

p {
  margin: 0 0 24px;
  color: #ddd;
}

.links {
  display: grid;
  gap: 14px;
}

a {
  display: block;
  padding: 16px;
  border-radius: 16px;
  text-decoration: none;
  color: white;
  font-weight: bold;
  font-size: 17px;
  border: 1px solid rgba(255,255,255,.3);
  background: rgba(255,255,255,.15);
  transition: .2s;
}

a:hover {
  transform: translateY(-3px);
  background: rgba(255,255,255,.25);
}

a:active {
  transform: scale(.98);
}

.footer {
  margin-top: 22px;
  color: #bbb;
  font-size: 12px;
}
</style>
</head>

<body>

<!-- الفيديو كخلفية -->
<video class="video-bg" autoplay muted loop playsinline preload="auto">
  <source src="./1000035118.mp4" type="video/mp4">
  متصفحك لا يدعم تشغيل الفيديو.
</video>

<div class="overlay"></div>

<main class="page">
  <section class="panel">

    <div class="avatar">و</div>

    <h1>وليد</h1>
    <p>تابعني على حساباتي</p>

    <div class="links">

      <a href="https://www.tiktok.com/@w.o.a7"
         target="_blank"
         rel="noopener">
        🎵 تيك توك — @w.o.a7
      </a>

      <a href="https://www.snapchat.com/add/twixl21"
         target="_blank"
         rel="noopener">
        👻 سناب شات — twixl21
      </a>

    </div>

    <div class="footer">
      اضغط على الحساب لفتحه
    </div>

  </section>
</main>

</body>
</html>
